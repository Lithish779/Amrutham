# Full local stack: API + worker + Postgres + Redis + Prometheus + Grafana + OTel collector + Jaeger
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: amrutam, POSTGRES_PASSWORD: amrutam, POSTGRES_DB: amrutam }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U amrutam"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  migrate:
    build: .
    command: ["node", "scripts/migrate.js"]
    environment: { DATABASE_URL: "postgres://amrutam:amrutam@postgres:5432/amrutam" }
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: .
    ports: ["8080:8080"]
    env_file: .env.example
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://amrutam:amrutam@postgres:5432/amrutam
      REDIS_URL: redis://redis:6379
      RUN_WORKER_IN_API: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  worker:
    build: .
    command: ["node", "-r", "./src/tracing.js", "src/worker.js"]
    env_file: .env.example
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://amrutam:amrutam@postgres:5432/amrutam
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: amrutam-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer }
    volumes:
      - ./observability/grafana/provisioning.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
      - ./observability/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/d.yml:ro
      - ./observability/grafana:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel.yml"]
    volumes: ["./observability/otel-collector.yml:/etc/otel.yml:ro"]
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686"]
volumes: { pgdata: {} }
