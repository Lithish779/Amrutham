name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: amrutam, POSTGRES_PASSWORD: amrutam, POSTGRES_DB: amrutam_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amrutam" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    strategy:
      matrix: { redis: ["", "redis://localhost:6379"] }   # in-memory fallback AND real Redis/BullMQ
    env:
      TEST_DATABASE_URL: postgres://amrutam:amrutam@localhost:5432/amrutam_test
      TEST_REDIS_URL: ${{ matrix.redis }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: matrix.redis == ''
        with: { name: coverage, path: coverage }
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency audit (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  image:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "amrutam-api:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Trivy image scan (fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with: { image-ref: "amrutam-api:${{ github.sha }}", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag amrutam-api:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: production        # required reviewers = manual approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Roll out (migrate Job first, then rolling update; auto-rollback on failed rollout)
        run: |
          echo "kubectl set image ... ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Configure KUBE_CONFIG secret and uncomment the kubectl steps in infra/k8s/README.md"
